name: Build MacOS LWJGL3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ejecutar Gradle (LWJGL3 MacosM1)
        working-directory: java
        run: ./gradlew lwjgl3:laffDistMacARM64 --no-daemon --console=plain --info

      - name: Install Platypus
        run: brew install platypus

      - name: Build .app
        run: |
          platypus \
          -a "Charnego Internatiolaff Soccer" \
          -o None \
          -i java/src/main/resources/libgdx128.png \
          -u "/bin/bash" \
          -V "${{ github.sha }}" \
          -s "java/build/macApp/launch.command" \
          -r \
          -o release/CharnegoInternatiolaffSoccer.app

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: laff-soccer-macos
          path: |
            release
